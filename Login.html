    /* HEADER */
    header {
      width: 100%;

      align-items: center;

      z-index: 1000;
    }

    .logo {
      display: flex;

      gap: 10px;
      font-size: 23px;
      font-weight: bold;
      color: #f47b20;
    }

    .logo img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

      font-weight: 500;
    }

    nav a:hover {
      color: #f47b20;
    }

    .login-btn {
      background: #f47b20;
      color: white !important;
      padding: 11px 20px;
      border-radius: 7px;
    }

    /* HERO */
    .hero {
      min-height: 550px;
      padding: 70px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      background: linear-gradient(135deg, #fff8f2, #ffffff);
    }

    .hero-text {
      max-width: 550px;
    }

    .hero-text h1 {
      font-size: 52px;
      line-height: 1.1;
      margin-bottom: 20px;
      color: #222;
    }

    .hero-text h1 span {
      color: #f47b20;
    }

    .hero-text p {
      font-size: 19px;
      line-height: 1.7;
      color: #666;
      margin-bottom: 30px;

    .explore-btn {
      display: inline-block;
      background: #f47b20;
      color: white;
      text-decoration: none;
      padding: 15px 28px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    .explore-btn:hover {
      background: #d96510;
      transform: translateY(-2px);
    }

    /* HERO ILLUSTRATION */
    .hero-art {
      width: 45%;

      position: relative;
      display: flex;
      align-items: center;

    .laptop {

      background: #333;
      border-radius: 15px 15px 5px 5px;
      padding: 12px;
      transform: rotate(-3deg);
      box-shadow: 0 20px 35px rgba(0,0,0,0.18);
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f47b20, #ffb36e);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    .book {
      position: absolute;
      width: 170px;
      height: 45px;
      background: #f47b20;
      border-radius: 5px;
      bottom: 25px;
      right: 15%;
      transform: rotate(8deg);
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }

    .book.two {
      background: #333;
      bottom: 60px;
      right: 19%;
      transform: rotate(-5deg);
    }
