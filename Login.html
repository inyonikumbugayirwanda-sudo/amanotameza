<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1877f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #1877f2;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Login</h1>

        <form>
            <input type="email" placeholder="Email" required>

            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>
    </div>

</body>
</html>
